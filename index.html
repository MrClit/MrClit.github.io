<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Restaura la ruta codificada por 404.html (truco SPA de GitHub Pages).
         Debe ejecutarse antes de que arranque el router. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <!-- Aplica el tema antes del primer paint para evitar el flash (FOUC).
         Lee el tema persistido por Zustand (localStorage 'theme-storage') o,
         si no hay valor, la preferencia del sistema (prefers-color-scheme). -->
    <script type="text/javascript">
      (function () {
        try {
          var stored = localStorage.getItem('theme-storage');
          var theme = stored ? JSON.parse(stored).state.theme : null;
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.className = theme;
        } catch (e) {
          document.documentElement.className = 'light';
        }
      })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Víctor Sales — Portfolio</title>
