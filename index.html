<!DOCTYPE html>
<html lang="es" class="light">
  <head>
    <!-- Restaura la ruta codificada por 404.html (truco SPA de GitHub Pages).
         Debe ejecutarse antes de que arranque el router. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Víctor Sales — Portfolio</title>

      name="description"
      content="Portfolio of Víctor Sales — Corporate Performance Management (CPM) expert turned Software Developer, building data-driven software solutions."
    />
    <meta name="theme-color" content="#0f172a" />
    <link rel="canonical" href="https://mrclit.github.io/" />
    <link rel="icon" href="/favicon.ico" />

    <!-- Open Graph -->

    <meta property="og:url" content="https://mrclit.github.io/" />
    <meta property="og:title" content="Víctor Sales — Portfolio" />
    <meta
      property="og:description"
      content="Corporate Performance Management (CPM) expert turned Software Developer, building data-driven software solutions."
    />
    <meta property="og:image" content="https://mrclit.github.io/avatar.jpeg" />
    <meta property="og:image:alt" content="Víctor Sales" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->

    <meta name="twitter:image" content="https://mrclit.github.io/avatar.jpeg" />
  </head>

</html>
